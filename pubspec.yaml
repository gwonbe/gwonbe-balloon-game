name: balloon_game

description: "balloon_game"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/home_001_ko.png
    - assets/home_001_en.png
    - assets/2026_012_0-82.mp3 # game bgm
    - assets/2026_003_0-80.mp3 # home bgm

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon_001.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app_icon_001.png"
  remove_alpha_ios: true